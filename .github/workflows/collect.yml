name: Collect finished Kaggle jobs
on:
  schedule: [{cron: "17,47 * * * *"}]
  workflow_dispatch: {}
  push:
    paths: ["collect/RUN"]
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Anything pending?
        run: |
          P=""
          for d in jobs/*/; do j=$(basename $d); [ -f jobs/$j/RUN ] || continue
            if ! grep -qiE "COMPLETE|ERROR|CANCEL" results/$j/STATUS.txt 2>/dev/null; then P="$P $j"; fi
          done
          echo "PENDING=$P" >> $GITHUB_ENV; echo "pending:$P"
      - name: Fetch
        if: env.PENDING != ''
        run: |
          pip install -q kaggle; mkdir -p ~/.kaggle
          TOK="$KAGGLE_API_TOKEN"; KEY="$KAGGLE_KEY"; case "$KEY" in KGAT_*) TOK="$KEY"; KEY="";; esac
          if [ -n "$TOK" ]; then printf '%s' "$TOK" > ~/.kaggle/access_token; chmod 600 ~/.kaggle/access_token; export KAGGLE_API_TOKEN="$TOK"; export KAGGLE_KEY=""
          else printf '{"username":"%s","key":"%s"}' "$KAGGLE_USERNAME" "$KEY" > ~/.kaggle/kaggle.json; chmod 600 ~/.kaggle/kaggle.json; fi
          for j in $PENDING; do
            S=$(kaggle kernels status "$KAGGLE_USERNAME/fable-ladder-$j" 2>&1 | tail -1); echo "$j: $S"
            mkdir -p results/$j
            if echo "$S" | grep -qiE "complete|error|cancel"; then kaggle kernels output "$KAGGLE_USERNAME/fable-ladder-$j" -p results/$j 2>&1 | tail -2 || true; fi
            echo "$S ($(date -u +%Y-%m-%dT%H:%M:%SZ))" | sed "s/$KAGGLE_USERNAME/USER/g" > results/$j/STATUS.txt
          done
          git config user.name "fable-ladder-bot"; git config user.email "noreply@github.com"
          git add results/ && git commit -q -m "Collect: $PENDING" || echo "nothing to commit"
          git pull -q --rebase origin main && git push -q origin HEAD:main
